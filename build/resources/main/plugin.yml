name: hAutoCommand
description: Run Commands Automatic As Console
prefix: hAutoCommand
version: '1.0.0-BETA'

main: ir.paradoxteam.hAutoCommand.Main
api-version: '1.21'

authors: [ 123herobrine456 ]
website: https://modrinth.com/project/h-autocommand

commands:
  autocommand:
    description: Main command for hAutoCommand
    aliases: [hautocommand, hac, acmd]
permissions:
  hautocommand.admin:
    description: Allows reloading the config
    default: op